<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B3A53"/>
    </linearGradient>
    <linearGradient id="line" x1="160" y1="245" x2="1040" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <circle cx="1060" cy="70" r="150" fill="#0EA5E9" fill-opacity="0.09"/>
  <circle cx="1140" cy="230" r="110" fill="#10B981" fill-opacity="0.07"/>

  <text x="70" y="92" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="45" font-weight="700">Vinicios Falqueiro Reis</text>
  <text x="72" y="138" fill="#7DD3FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">DATA ENGINEER · AWS · PYSPARK · AIRFLOW · PYTHON · SQL</text>
  <text x="72" y="177" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Reliable cloud data platforms · Production pipelines · AI-ready datasets</text>
  <text x="72" y="211" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Brazil-based · Remote contract engagements with international teams</text>

  <path d="M160 258 H1040" stroke="url(#line)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="105" y="238" width="110" height="40" rx="10" fill="#111827" stroke="#38BDF8" stroke-opacity="0.8"/>
    <text x="160" y="263" text-anchor="middle" fill="#BAE6FD">INGEST</text>

    <rect x="320" y="238" width="125" height="40" rx="10" fill="#111827" stroke="#22D3EE" stroke-opacity="0.8"/>
    <text x="382" y="263" text-anchor="middle" fill="#A5F3FC">ORCHESTRATE</text>

    <rect x="550" y="238" width="120" height="40" rx="10" fill="#111827" stroke="#2DD4BF" stroke-opacity="0.8"/>
    <text x="610" y="263" text-anchor="middle" fill="#99F6E4">PROCESS</text>

    <rect x="775" y="238" width="115" height="40" rx="10" fill="#111827" stroke="#34D399" stroke-opacity="0.8"/>
    <text x="832" y="263" text-anchor="middle" fill="#A7F3D0">VALIDATE</text>

    <rect x="985" y="238" width="110" height="40" rx="10" fill="#111827" stroke="#6EE7B7" stroke-opacity="0.8"/>
    <text x="1040" y="263" text-anchor="middle" fill="#D1FAE5">DELIVER</text>
  </g>
</svg>
